plugins {
    id 'com.google.cloud.tools.jib' version '3.4.5' apply false
}

apply plugin: 'base'

allprojects {
    group = "com.gearit"
    version = '0.1.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)

    apply plugin: "java"
    apply plugin: "idea"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}