spring.application.name=gearit-backend

spring.security.oauth2.client.registration.yandex.client-id=b786f5076cfb40cbafd82f3d2b36aeae
spring.security.oauth2.client.registration.yandex.client-secret=16c95cc9d1c2460abaa7534c022d1a5e
spring.security.oauth2.client.registration.yandex.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.yandex.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.yandex.scope=login:email login:info
spring.security.oauth2.client.registration.yandex.client-name=Yandex

spring.security.oauth2.client.provider.yandex.authorization-uri=https://oauth.yandex.ru/authorize
spring.security.oauth2.client.provider.yandex.token-uri=https://oauth.yandex.ru/token
spring.security.oauth2.client.provider.yandex.user-info-uri=https://login.yandex.ru/info
spring.security.oauth2.client.provider.yandex.user-name-attribute=default_email

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changelog/db.changelog-master.yaml
spring.liquibase.database-change-log-table=gearit_changelog
spring.liquibase.database-change-log-lock-table=gearit_changelog_lock

# Database properties
spring.datasource.url=jdbc:postgresql://localhost:5432/gearit
spring.datasource.username=tester
spring.datasource.password=tester

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true