name: Проверка корректности содержимого openapi
on:
  push:
    paths:
      - openapi.gearit.yaml

jobs:
  linter:
    runs-on: [ ubuntu-latest ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Redocly CLI
        run: npm install @redocly/cli --save-dev

      - name: Lint OpenAPI
        run: redocly lint openapi.gearit.yaml