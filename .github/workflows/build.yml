name: Публикация образа backend-a и рестарт сервиса
on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: [ ubuntu-latest ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and push docker image
        run: |
          ./gradlew jib -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME }} -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD }}
