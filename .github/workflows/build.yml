name: Публикация docker образа backend-a. Деплой.
on:
  push:
    branches: [ master ]

jobs:

  tests:
    name: Run Unit tests
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: |
          cd backend
          ./gradlew test

  build:
    name: Build and Push docker image
    runs-on: [ ubuntu-latest ]
    needs: tests
    environment:
      name: gearit
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      APP_VERSION: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build and push docker image
        run: |
          cd backend
          ./gradlew jib

