openapi: 3.1.0
info:
  title: gearit-api
  description: gearit-api
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
tags:
  - name: Authentication
    description: Аутентификация/Авторизация/Регистрация пользователей в системе.
  - name: Password
    description: Восстановление/изменение пароля пользователя.
  - name: Account
    description: Операции с пользовательским аккаунтом.
  - name: Users
    description: Операции с пользователями.
  - name: Access policy
    description: Управление привилегиями пользователя.
  - name: Application
    description: Служебная информация о приложении.
  - name: Automobile
    description: Операции с автомобилями.
  - name: Organization
    description: Операции с организациями пользователя.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Регистрация
      operationId: register
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                password:
                  type: string
                email:
                  type: string
      responses:
        200:
          description: Успешная регистрация.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/auth/verify:
    get:
      tags:
        - Authentication
      summary: Подтверждение аккаунта пользователя.
      operationId: verify
      security: [ ]
      parameters:
        - name: code
          in: query
          description: Код подтверждения, отправленный на почту
          required: true
          schema:
            type:
              - string
      responses:
        200:
          description: Успешное подтверждение аккаунта.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Аутентификация пользователя
      operationId: login
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Успешная аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/auth/token/refresh:
    post:
      tags:
        - Authentication
      summary: Обновление access токена.
      operationId: refresh
      security: [ ]
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
      responses:
        200:
          description: Успешное обновление токенов доступа.
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  accessToken:
                    type: string
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/password/forgot:
    post:
      tags:
        - Password
      summary: Отправка уведомления о восстановление пароля на почту
      operationId: passwordForgot
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                email:
                  type: string
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/password/verify-code:
    post:
      tags:
        - Password
      summary: Проверка на валидность отправленного кода для восстановления пароля.
      operationId: passwordVerifyCode
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                code:
                  type: string
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/password/reset:
    post:
      tags:
        - Password
      summary: Обновление пароля пользователя
      operationId: passwordReset
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/yandex/login:
    get:
      tags:
        - Authentication
      summary: Авторизация через сервер OAuth Yandex.
      operationId: yandex/login
      security: [ ]
      responses:
        200:
          description: Успешное получение редиректа.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/yandex/callback:
    get:
      tags:
        - Authentication
      summary: Авторизация через сервер OAuth Yandex.
      operationId: yandex/callback
      security: [ ]
      responses:
        200:
          description: Успешное добавление пользователя в БД и получение токенов доступа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/account:
    get:
      tags:
        - Account
      summary: Информация об аккаунте пользователя.
      operationId: account
      security:
        - JWT: [ ]
      responses:
        200:
          description: Успешное получение информации об аккаунте пользователя.
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  id:
                    type: integer
                  firstName:
                    type: string
                  middleName:
                    type: string
                  lastName:
                    type: string
                  email:
                    type: string
                  phoneNumber:
                    type: string
                  gender:
                    type: string
                    enum:
                      - MALE
                      - FEMALE
                  birthDate:
                    type: string
                    format: '2025-06-02 20:00:00.000000'
                  avatarId:
                    type: string
                  createdAt:
                    type: string
                    description: Дата регистрации пользователя.
                    format: '2025-06-02 20:00:00.000000'
                  updatedAt:
                    type: string
                    description: Дата последнего обновления информации об аккаунте.
                    format: '2025-06-02 20:00:00.000000'
                  passwordUpdatedAt:
                    type: string
                    format: '2025-06-02 20:00:00.000000'
                    description: Дата последнего обновления пароля.
        403:
          description: Если был передан некорректный accessToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
    post:
      tags:
        - Account
      summary: Обновление аккаунта пользователя.
      operationId: account/update
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                id:
                  type: integer
                firstName:
                  type: string
                middleName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                birthDate:
                  type: string
                  format: '2025-06-02 20:00:00.000000'
      responses:
        200:
          description: Успешное обновление аккаунта пользователя.
        400:
          description: Если был переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/user-provider:
    post:
      tags:
        - Users
      summary: Получение списка пользователей.
      operationId: users/get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка пользователей.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProviderView"
        400:
          description: Если был переданы некорректные данные фильтра.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/user-provider/access-policy:
    post:
      tags:
        - Users
      summary: Назначение политики доступа пользователю.
      operationId: users/access-policy
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                userProviderId:
                  type: integer
                accessPolicyId:
                  type: integer
      responses:
        200:
          description: Успешное получение списка пользователей.
        400:
          description: Если был переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/user-provider/block:
    post:
      tags:
        - Users
      summary: Блокировка пользователей по ID.
      operationId: users/block
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type:
                - object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Идентификаторы пользователей.
      responses:
        200:
          description: Успешная блокировка пользователей.
        400:
          description: Если был переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/access-policy:
    post:
      tags:
        - Access policy
      summary: Получение всех политик доступа.
      operationId: accessPolicy/get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка политик доступа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/access-policy/resources:
    get:
      tags:
        - Access policy
      summary: Получение доступных ресурсов текущему авторизованному пользователю.
      operationId: accessPolicyResources/get
      security:
        - JWT: [ ]
      responses:
        200:
          description: Успешное получение доступных ресурсов.
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  availableResources:
                    type: array
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /application/version:
    get:
      tags:
        - Application
      summary: Получение актуальной версии backend-a.
      operationId: getApplicationVersion
      security: [ ]
      responses:
        200:
          description: Успешное получение текущей версии backend-a.
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  version:
                    type: string
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/automobile:
    post:
      tags:
        - Automobile
      summary: Добавление авто текущего авторизованного пользователя.
      operationId: automobile/add
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                factoryId:
                  type: integer
                modelId:
                  type: integer
                color:
                  type: string
                license:
                  type: string
                  description: Гос. номер авто.
                bodyType:
                  type: string
                  enum:
                    - SEDAN
                    - HATCHBACK
                    - COUPE
                    - PICKUP
                    - VAN
                    - CROSSOVER
                    - CABRIOLET
                year:
                  type: integer
                  description: Год выпуска.
                odometer:
                  type: integer
                  description: Пробег авто.
      responses:
        200:
          description: Успешное добавление авто для текущего авторизованного пользователя.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/automobile/my:
    post:
      tags:
        - Automobile
      summary: Получение списка всех авто текущего авторизованного пользователя.
      operationId: automobile/block:get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка всех авто текущего авторизованного пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/automobile/delete:
    post:
      tags:
        - Automobile
      summary: Удаление автомобилей текущего авторизованного пользователя.
      operationId: automobile/block:delete
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                automobileIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        200:
          description: Успешное удаление автомобилей текущего авторизованного пользователя.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/automobile/factories-models:
    post:
      tags:
        - Automobile
      summary: Получение списка автомобильных производителей и их модели.
      operationId: automobileFactoryModels/get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка всех автомобильных производителей и их модели.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/automobile/{automobileId}:
    post:
      tags:
        - Automobile
      summary: Обновление авто по ID текущего авторизованного пользователя.
      operationId: automobile/update
      security:
        - JWT: [ ]
      parameters:
        - in: path
          name: automobileId
          schema:
            type: integer
          required: true
          description: Идентификатор автомобиля пользователя, который необходимо обновить.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                factoryId:
                  type: integer
                modelId:
                  type: integer
                color:
                  type: string
                license:
                  type: string
                  description: Гос. номер авто.
                bodyType:
                  type: string
                  enum:
                    - SEDAN
                    - HATCHBACK
                    - COUPE
                    - PICKUP
                    - VAN
                    - CROSSOVER
                    - CABRIOLET
                year:
                  type: integer
                  description: Год выпуска.
                odometer:
                  type: integer
                  description: Пробег авто.
      responses:
        200:
          description: Успешное обновление авто для текущего авторизованного пользователя.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/organization:
    post:
      tags:
        - Organization
      summary: Получение списка организаций пользователя, введенные в эксплуатацию (прошедшие проверку администратора).
      operationId: organizations/get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка организаций пользователя, введенные в эксплуатацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /api/v1/organization/register:
    post:
      tags:
        - Organization
      summary: Создание запроса на регистрацию новой организации.
      operationId: organizationRequest/add
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullname:
                  type: string
                  description: Полное наименование организации.
                abbreviatedName:
                  type: string
                  description: Сокращенное название.
                description:
                  type: string
                  description: Вид деятельности.
                registeredAddress:
                  type: string
                  description: Юридический адрес регистрации.
                currentAddress:
                  type: string
                  description: Фактический адрес.
                phone:
                  type: string
                  description: Телефон руководителя.
                inn:
                  type: string
                  description: ИНН (12 цифр).
                kpp:
                  type: string
                  description: КПП (9 цифр).
                year:
                  type: integer
                  description: Год регистрации организации.
      responses:
        200:
          description: Успешное создание запроса на регистрацию организации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClientException:
      type:
        - object
      properties:
        message:
          type: string
          example: 'Incorrect user data'
        extendedHelp:
          type: string
          example: 'Password cannot be null or empty'

    LoginResponse:
      type:
        - object
      properties:
        accessToken:
          type: string

    PageableRequest:
      type:
        - object
      description: Запрос на получение данных с пагинацией, фильтрацией, сортировкой.
      properties:
        page:
          type: integer
          description: Текущая запрашиваемая страница.
        size:
          type: integer
          description: Необходимое количество получаемых элементов.
        container:
          type: array
          description: Контейнер с фильтрами.
          $ref: "#/components/schemas/Filter"

    PageableResponse:
      type:
        - object
      properties:
        page:
          type: integer
          description: Номер текущей страницы.
        pages:
          type: integer
          description: Количество страниц.
        items:
          type: array
        total:
          type: integer
          description:
            Всего элементов.

    Filter:
      type:
        - object
      description:
        Фильтр, используется для формирования выборки по условиям.
      properties:
        field:
          type: string
          description: Наименование поля, по которому предполагается фильтрация
        condition:
          $ref: "#/components/schemas/FilterCondition"
        value:
          type: object
          description: Значение, по которому фильтруются данные.

    FilterCondition:
      type: string
      description:
        Условие фильтрации.
      enum:
        - EQUALS
        - NOT_EQUALS
        - GREATER_THAN
        - LESS_THAN
        - CONTAINS

    UserProviderView:
      type:
        - object
      properties:
        id:
          type: integer
        email:
          type: string
        provider:
          type: string
          enum:
            - INTERNAL
            - OAUTH
          description: Тип регистрации.
        accessPolicy:
          type: object
          $ref: "#/components/schemas/AccessPolicy"
        accountInfo:
          type: object
          description: Детальная информация пользователя.
          properties:
            firstName:
              type: string
            lastName:
              type: string
            avatarId:
              type: string
            birthDate:
              type: string
              format: '2025-06-02 20:00:00.000000'
        createdAt:
          type: string
          description: Дата регистрации пользователя.
          format: '2025-06-02 20:00:00.000000'
        updatedAt:
          type: string
          description: Дата последнего обновления информации об аккаунте.
          format: '2025-06-02 20:00:00.000000'
        passwordUpdatedAt:
          type: string
          format: '2025-06-02 20:00:00.000000'
          description: Дата последнего обновления пароля.
        isBlocked:
          type: boolean
          description: Заблокирован ли пользователь в системе.

    AccessPolicy:
      type:
        - object
      properties:
        id:
          type: integer
        name:
          type: string
        endpoints:
          type: array
          $ref: "#/components/schemas/Endpoint"

    Endpoint:
      type:
        - object
      properties:
        id:
          type: integer
        method:
          type: string
        path:
          type: string
        description:
          type: string
        resource:
          type: string
