openapi: 3.1.0
info:
  title: gearit-api
  description: gearit-api
  version: 0.1.1
servers:
  - url: 'http://localhost:8080/api/v1'
tags:
  - name: Auth
    description: Аутентификация/Авторизация/Регистрация пользователей в системе
  - name: Password
    description: Восстановление/изменение пароля пользователя
  - name: Account
    description: Операции с пользовательским аккаунтом
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация
      operationId: register
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        200:
          description: Успешная регистрация.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /auth/verify:
    get:
      tags:
        - Auth
      summary: Подтверждение аккаунта пользователя.
      operationId: verify
      security: []
      parameters:
        - name: code
          in: query
          description: Код подтверждения, отправленный на почту
          required: true
          schema:
            type:
              - string
      responses:
        200:
          description: Успешное подтверждение аккаунта.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Логин
      operationId: login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Успешная аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /auth/token/refresh:
    post:
      tags:
        - Auth
      summary: Обновление токена доступа
      operationId: refresh
      security: []
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
      responses:
        200:
          description: Успешное обновление токенов доступа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /password/forgot:
    post:
      tags:
        - Password
      summary: Отправка уведомления о восстановление пароля на почту
      operationId: passwordForgot
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotRequest'
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /password/verify-code:
    post:
      tags:
        - Password
      summary: Проверка на валидность отправленного кода для восстановления пароля
      operationId: passwordVerifyCode
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /password/reset:
    post:
      tags:
        - Password
      summary: Обновление пароля пользователя
      operationId: passwordReset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /yandex/login:
    get:
      tags:
        - Auth
      summary: Авторизация через сервер OAuth Yandex
      operationId: yandex/login
      security: []
      responses:
        200:
          description: Успешное получение редиректа
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /yandex/callback:
    get:
      tags:
        - Auth
      summary: Авторизация через сервер OAuth Yandex
      operationId: yandex/callback
      security: []
      responses:
        200:
          description: Успешное добавление пользователя в БД и получение токенов доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /account:
    get:
      tags:
        - Account
      summary: Информация об аккаунте пользователя
      operationId: account
      security:
        - JWT: []
      responses:
        200:
          description: Успешное получение информации об аккаунте пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        403:
          description: Если был передан некорректный accessToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
    post:
      tags:
        - Account
      summary: Обновление аккаунта пользователя
      operationId: account/update
      security:
        - JWT: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountInfoRequest'
      responses:
        200:
          description: Успешное обновление аккаунта пользователя
        400:
          description: Если был переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClientException:
      type:
        - object
      properties:
        message:
          type:
            - string
          example: 'Incorrect user data'
        extendedHelp:
          type:
            - string
          example: 'Password cannot be null or empty'

    RegisterRequest:
      type:
        - object
      properties:
        password:
          type:
            - string
        email:
          type:
            - string

    LoginRequest:
      type:
        - object
      properties:
        email:
          type:
            - string
        password:
          type:
            - string

    LoginResponse:
      type:
        - object
      properties:
        accessToken:
          type:
            - string

    RefreshResponse:
      type:
        - object
      properties:
        accessToken:
          type:
            - string

    ForgotRequest:
      type:
        - object
      properties:
        email:
          type:
            - string

    VerifyCodeRequest:
      type:
        - object
      properties:
        code:
          type:
            - string

    ResetPasswordRequest:
      type:
        - object
      properties:
        code:
          type:
            - string
        newPassword:
          type:
            - string

    UpdateAccountInfoRequest:
      type:
        - object
      properties:
        id:
          type:
            - integer
        firstName:
          type:
            - string
        middleName:
          type:
            - string
        lastName:
          type:
            - string
        phoneNumber:
          type:
            - string
        gender:
          type:
            - string
          enum:
            - MALE
            - FEMALE
        birthDate:
          type:
            - string
          format: '2025-06-02 20:00:00.000000'

    AccountInfo:
      type:
        - object
      properties:
        id:
          type:
            - integer
        firstName:
          type:
            - string
        middleName:
          type:
            - string
        lastName:
          type:
            - string
        phoneNumber:
          type:
            - string
        gender:
          type:
            - string
          enum:
            - MALE
            - FEMALE
        birthDate:
          type:
            - string
          format: '2025-06-02 20:00:00.000000'
        avatarId:
          type:
            - string