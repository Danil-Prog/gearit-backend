openapi: 3.1.0
info:
  title: Gearit-api
  description: Gearit-api
  version: 0.1.1
servers:
  - url: 'http://localhost:8080/api/v1'
tags:
  - name: Auth
    description: Аутентификация/Авторизация/Регистрация пользователей в системе
  - name: Profile
    description: Операции с профилем пользователя
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация

  /auth/login:
    post:
      tags:
        - Auth
      summary: Авторизация

  /auth/token/refresh:
    post:
      tags:
        - Auth
      summary: Обновление токена доступа

components:
  schemas:
    RegisterRequest:
      type:
        - object
      properties:
        username:
          type:
            - string
        email:
          type:
            - string
        password:
          type:
            - string

    RegisterResponse:
      type:
        - object
      properties:
        isRegister:
          type:
            - boolean

    LoginResponse:
      type:
        - object
      properties:
        accessToken:
          type:
            - string
        refreshToken:
          type:
            - string

    TokenResponse:
      type:
        - object
      properties:
        accessToken:
          type:
            - string