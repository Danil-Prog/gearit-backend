openapi: 3.1.0
info:
  title: gearit-api
  description: gearit-api
  version: 0.1.1
servers:
  - url: 'http://localhost:8080/api/v1'
tags:
  - name: Auth
    description: Аутентификация/Авторизация/Регистрация пользователей в системе.
  - name: Password
    description: Восстановление/изменение пароля пользователя.
  - name: Account
    description: Операции с пользовательским аккаунтом.
  - name: Users
    description: Операции с пользователями.
  - name: AccessPolicy
    description: Управление привилегиями пользователя.
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация
      operationId: register
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        200:
          description: Успешная регистрация.
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /auth/verify:
    get:
      tags:
        - Auth
      summary: Подтверждение аккаунта пользователя.
      operationId: verify
      security: [ ]
      parameters:
        - name: code
          in: query
          description: Код подтверждения, отправленный на почту
          required: true
          schema:
            type:
              - string
      responses:
        200:
          description: Успешное подтверждение аккаунта.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Логин
      operationId: login
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Успешная аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /auth/token/refresh:
    post:
      tags:
        - Auth
      summary: Обновление токена доступа
      operationId: refresh
      security: [ ]
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
      responses:
        200:
          description: Успешное обновление токенов доступа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /password/forgot:
    post:
      tags:
        - Password
      summary: Отправка уведомления о восстановление пароля на почту
      operationId: passwordForgot
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotRequest'
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /password/verify-code:
    post:
      tags:
        - Password
      summary: Проверка на валидность отправленного кода для восстановления пароля
      operationId: passwordVerifyCode
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /password/reset:
    post:
      tags:
        - Password
      summary: Обновление пароля пользователя
      operationId: passwordReset
      security: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Успешная отправка уведомления.
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /yandex/login:
    get:
      tags:
        - Auth
      summary: Авторизация через сервер OAuth Yandex
      operationId: yandex/login
      security: [ ]
      responses:
        200:
          description: Успешное получение редиректа
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /yandex/callback:
    get:
      tags:
        - Auth
      summary: Авторизация через сервер OAuth Yandex
      operationId: yandex/callback
      security: [ ]
      responses:
        200:
          description: Успешное добавление пользователя в БД и получение токенов доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Если были переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /account:
    get:
      tags:
        - Account
      summary: Информация об аккаунте пользователя
      operationId: account
      security:
        - JWT: [ ]
      responses:
        200:
          description: Успешное получение информации об аккаунте пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountInfoResponse'
        403:
          description: Если был передан некорректный accessToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
    post:
      tags:
        - Account
      summary: Обновление аккаунта пользователя.
      operationId: account/update
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountInfoRequest'
      responses:
        200:
          description: Успешное обновление аккаунта пользователя
        400:
          description: Если был переданы некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /user-provider:
    post:
      tags:
        - Users
      summary: Получение списка пользователей.
      operationId: users/get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка пользователей.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProviderView"
        400:
          description: Если был переданы некорректные данные фильтра.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /user-provider/access-policy:
    post:
      tags:
        - Users
      summary: Назначение политики доступа пользователю.
      operationId: users/access-policy
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessPolicyUserProviderRequest'
      responses:
        200:
          description: Успешное получение списка пользователей.
        400:
          description: Если был переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /user-provider/block:
    post:
      tags:
        - Users
      summary: Блокировка пользователей по ID.
      operationId: users/block
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserProvidersRequest'
      responses:
        200:
          description: Успешная блокировка пользователей.
        400:
          description: Если был переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /access-policy:
    post:
      tags:
        - AccessPolicy
      summary: Получение всех политик доступа.
      operationId: accessPolicy/get
      security:
        - JWT: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageableRequest'
      responses:
        200:
          description: Успешное получение списка политик доступа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

  /access-policy/resources:
    get:
      tags:
        - AccessPolicy
      summary: Получение доступных ресурсов текущему авторизованному пользователю.
      operationId: accessPolicyResources/get
      security:
        - JWT: [ ]
      responses:
        200:
          description: Успешное получение доступных ресурсов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAvailableResourcesResponse'
        400:
          description: Если были переданы некорректные данные.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"
        500:
          description: Ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientException"

components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClientException:
      type:
        - object
      properties:
        message:
          type: string
          example: 'Incorrect user data'
        extendedHelp:
          type: string
          example: 'Password cannot be null or empty'

    RegisterRequest:
      type:
        - object
      properties:
        password:
          type: string
        email:
          type: string

    LoginRequest:
      type:
        - object
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type:
        - object
      properties:
        accessToken:
          type: string

    RefreshResponse:
      type:
        - object
      properties:
        accessToken:
          type: string

    ForgotRequest:
      type:
        - object
      properties:
        email:
          type: string

    VerifyCodeRequest:
      type:
        - object
      properties:
        code:
          type: string

    ResetPasswordRequest:
      type:
        - object
      properties:
        code:
          type: string
        newPassword:
          type: string

    UpdateAccountInfoRequest:
      type:
        - object
      properties:
        id:
          type: integer
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        birthDate:
          type: string
          format: '2025-06-02 20:00:00.000000'

    GetAccountInfoResponse:
      type:
        - object
      properties:
        id:
          type: integer
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        birthDate:
          type: string
          format: '2025-06-02 20:00:00.000000'
        avatarId:
          type: string
        createdAt:
          type: string
          description: Дата регистрации пользователя.
          format: '2025-06-02 20:00:00.000000'
        updatedAt:
          type: string
          description: Дата последнего обновления информации об аккаунте.
          format: '2025-06-02 20:00:00.000000'
        passwordUpdatedAt:
          type: string
          format: '2025-06-02 20:00:00.000000'
          description: Дата последнего обновления пароля.

    PageableRequest:
      type:
        - object
      description: Запрос на получение данных с пагинацией, фильтрацией, сортировкой.
      properties:
        page:
          type: integer
          description: Текущая запрашиваемая страница.
        size:
          type: integer
          description: Необходимое количество получаемых элементов.
        container:
          type: array
          description: Контейнер с фильтрами.
          $ref: "#/components/schemas/Filter"

    PageableResponse:
      type:
        - object
      properties:
        page:
          type: integer
          description: Номер текущей страницы.
        pages:
          type: integer
          description: Количество страниц.
        items:
          type: array
        total:
          type: integer
          description:
            Всего элементов.

    Filter:
      type:
        - object
      description:
        Фильтр, используется для формирования выборки по условиям.
      properties:
        field:
          type: string
          description: Наименование поля, по которому предполагается фильтрация
        condition:
          $ref: "#/components/schemas/FilterCondition"
        value:
          type: object
          description: Значение, по которому фильтруются данные.

    FilterCondition:
      type: string
      description:
        Условие фильтрации.
      enum:
        - EQUALS
        - NOT_EQUALS
        - GREATER_THAN
        - LESS_THAN
        - CONTAINS

    GetAvailableResourcesResponse:
      type:
        - object
      properties:
        availableResources:
          type: array

    UpdateAccessPolicyUserProviderRequest:
      type:
        - object
      properties:
        userProviderId:
          type: integer
        accessPolicyId:
          type: integer

    UserProviderView:
      type:
        - object
      properties:
        id:
          type: integer
        email:
          type: string
        provider:
          type: string
          enum:
            - INTERNAL
            - OAUTH
          description: Тип регистрации.
        accessPolicy:
          type: object
          $ref: "#/components/schemas/AccessPolicy"
        accountInfo:
          type: object
          description: Детальная информация пользователя.
          properties:
            firstName:
              type: string
            lastName:
              type: string
            avatarId:
              type: string
            birthDate:
              type: string
              format: '2025-06-02 20:00:00.000000'
        createdAt:
          type: string
          description: Дата регистрации пользователя.
          format: '2025-06-02 20:00:00.000000'
        updatedAt:
          type: string
          description: Дата последнего обновления информации об аккаунте.
          format: '2025-06-02 20:00:00.000000'
        passwordUpdatedAt:
          type: string
          format: '2025-06-02 20:00:00.000000'
          description: Дата последнего обновления пароля.
        isBlocked:
          type: bool
          description: Заблокирован ли пользователь в системе.

    AccessPolicy:
      type:
        - object
      properties:
        id:
          type: integer
        name:
          type: string
        endpoints:
          type: array
          $ref: "#/components/schemas/Endpoint"

    Endpoint:
      type:
        - object
      properties:
        id:
          type: integer
        method:
          type: string
        path:
          type: string
        description:
          type: string
        resource:
          type: string

    BlockUserProvidersRequest:
      type:
        - object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: Идентификаторы пользователей.
